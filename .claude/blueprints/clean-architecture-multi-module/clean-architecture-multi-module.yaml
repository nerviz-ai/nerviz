id: clean-architecture-multi-module
name: Clean Architecture (Uncle Bob) — multi-module
description: >
  Domain at the center, concrete use cases in the application layer, infrastructure as
  the single outer module — three modules, dependency rule still enforced by Maven.
when_to_choose:
  - Business rules that need to stay isolated from infrastructure details
  - Small/medium team that wants the domain→application→infra boundary without extra
    interface+impl boilerplate per use case
  - Need to swap infrastructure (DB, messaging, web framework) without touching
    business rules, but without needing separate modules per adapter type
trade_offs:
  - A use case is a single class (no interface of its own) — swapping its implementation
    means editing the application layer, not just the infra
  - REST, persistence and messaging share an `infrastructure` module — no build isolation
    between adapters, a messaging dependency pulls in the whole module
  - Main, config and wiring live inside `infrastructure` — there's no separate bootstrap
    assembling the graph from outside

build:
  layout: multi-module
  tool: maven

# Globs that identify the code covered by `rules/architecture-ddd.md` (DDD +
# dependency direction). They go verbatim into the `paths` frontmatter of the file the
# bootstrap generates at <project>/.claude/rules/architecture-ddd.md — they are not
# inferred from `modules[].path`, because not every blueprint uses the same directory
# names.
architecture_paths:
  - "domain/**/*.java"
  - "application/**/*.java"
  - "infrastructure/**/*.java"
  - "commons/**/*.java"

modules:
  - id: domain
    path: domain
    depends_on: []
    forbidden_imports:
      - "org.springframework.."
      - "jakarta.persistence.."
      - "jakarta.validation.."
      - "com.fasterxml.jackson.."
      - "tools.jackson.."  # Jackson 3 (Spring Boot 4) core; annotations stay under com.fasterxml.jackson
      - "graphql.."  # graphql-java; Spring for GraphQL is already under org.springframework — decision 0146
      - "com.mongodb.."  # a document store's driver, BSON and the search clients stay in the outbound adapters; Spring Data is already under org.springframework — decision 0147
      - "org.bson.."
      - "co.elastic.."
      - "org.opensearch.."
      - "org.hibernate.."  # Hibernate and Envers stay in the persistence adapter; Spring Data auditing is already under org.springframework — decision 0149
      - "org.slf4j.."  # the domain throws and returns, the adapter or application service logs — rules/logging.md, decision 0154
      - "ch.qos.logback.."
      - "org.apache.logging.."
      - "org.apache.commons.logging.."
      - "lombok.extern.."  # @Slf4j and the other Lombok logger annotations; Lombok itself stays allowed
      - "org.mapstruct.."  # a mapper lives in the adapter that owns the types it translates — decision 0160
  # Cross-cutting infra (logging/masking annotations + AOP aspects, see rules/logging.md)
  # — not business code. A leaf, same as `domain`, but on the other side of the
  # zero-framework line: everything else depends on it, `domain` never does. Bootstrap
  # only creates the empty package-info; the real classes are installed once, later, by
  # the `commons-logging-installer` agent.
  - id: commons
    path: commons
    depends_on: []
  - id: application
    path: application
    depends_on: [domain, commons]
    forbidden_imports:
      - "jakarta.persistence.."
      - "org.springframework.web.."
      - "org.springframework.ai.."  # the model suggests through a port; the library stays in infrastructure.ai — decision 0145
      - "org.springframework.graphql.."  # a resolver calls the use case; the library stays in infrastructure.graphql — decision 0146
      - "graphql.."
      - "org.springframework.data.mongodb.."  # a port is all the application sees of a document store or a search index — decision 0147
      - "com.mongodb.."
      - "org.bson.."
      - "org.springframework.data.elasticsearch.."
      - "co.elastic.."
      - "org.opensearch.."
      - "org.hibernate.envers.."  # the history is read through a port; Envers, Spring Data history and the auditing annotations stay in the persistence adapter — decision 0149
      - "org.hibernate.annotations.."
      - "org.springframework.data.history.."
      - "org.springframework.data.envers.."
      - "org.springframework.data.annotation.."
      - "org.mapstruct.."  # a mapper lives in the adapter that owns the types it translates — decision 0160
  - id: infrastructure
    path: infrastructure
    depends_on: [application, domain, commons]
    contains_main: true

packages:
  base: "{{groupId}}.{{artifactName}}"
  map:
    domain.model: "domain.model"
    domain.event: "domain.event"
    domain.exception: "domain.exception"
    application.usecase: "application.usecase"
    application.port: "application.port"
    # Cross-cutting application-layer infrastructure that belongs to no single
    # aggregate/use case — e.g. `IdempotentExecution`, the shared component
    # `rest-api-architect`'s Idempotency-Key exemplars assume. Without this entry the
    # executor invents an ad hoc package the first time it needs one (lessons-learned-006
    # § 4, observed on the single-module sibling blueprint) instead of following
    # architecture data. Lives in the `application` module, same `depends_on` as
    # `application.usecase`/`application.port`.
    application.shared: "application.shared"
    infrastructure.rest: "infrastructure.rest"
    infrastructure.persistence: "infrastructure.persistence"
    infrastructure.messaging: "infrastructure.messaging"
    # Scheduling triggers (a driving adapter calling an input port) — decision 0087.
    # Lives in the `infrastructure` module, same as the other `infrastructure.*` entries.
    infrastructure.scheduling: "infrastructure.scheduling"
    # Outbound HTTP adapters (one subpackage per remote system, plus `shared`) — decision 0121.
    infrastructure.http: "infrastructure.http"
    # Cache decorators of outbound ports, and the cache wiring — decision 0144.
    infrastructure.cache: "infrastructure.cache"
    # Outbound AI adapters (a language model or a vector store behind a port) and the AI wiring — decision 0145.
    infrastructure.ai: "infrastructure.ai"
    # Outbound search adapters — a search engine index kept as a projection — decision 0147.
    infrastructure.search: "infrastructure.search"
    # Inbound GraphQL adapter (controllers, their records, the GraphQL wiring) — decision 0146.
    infrastructure.graphql: "infrastructure.graphql"
    infrastructure.config: "infrastructure.config"
    commons.logging: "commons.logging"
    # The system actor a job or a consumer runs its pass under, used by both and by neither's
    # adapter, so it lives beside the logging commons — decision 0149.
    commons.audit: "commons.audit"

# Naming convention for this blueprint (specific to clean-architecture, not universal —
# see .claude/rules/architecture-ddd.md for what IS universal, DDD, and
# .claude/rules/naming.md for the rest). A use case is a single class — no interface of
# its own — because the interface/impl split for the use case is what this blueprint cut
# to stay simpler than the version with a `usecase` module:
#   Use case (concrete, no interface): <Verb><Noun>UseCase  — e.g. CreateUserUseCase
#   Command (record, co-located in the SAME package as its UseCase, one per use case):
#                            <Verb><Noun>Command             — e.g. CreateUserCommand.
#                            The one type in the use-case package that doesn't end in
#                            `UseCase`; being a record, the ArchUnit role rules already
#                            exempt it by type
#   Grouping (one subpackage per aggregate, always — even with a single aggregate):
#                            `application.usecase.<aggregate>`  — e.g. application.usecase.user
#                            holds CreateUserUseCase and CreateUserCommand. A use case lives
#                            with the aggregate it writes, a query with the one it reads, the
#                            outbox relay and prune use cases in `outbox`; one that touches no
#                            aggregate, with the one its trigger concerns (a reaction to
#                            OrderConfirmed: `order`), else under the noun of its own name
#                            (RequestShippingQuote: `shippingquote`). Same lowercase
#                            segment as the persistence adapter's subpackage; the test tree
#                            mirrors it. A type the use cases of several aggregates share
#                            stays at the package root
#   Output port (interface, lives in application, implemented by infra):
#                            <Capability>                    — e.g. SendNotification, RegisterEvent, DataProvider
#   Port implementation (lives in infrastructure): <Capability><Technology>Adapter
#                                                      — e.g. SendNotificationEmailAdapter, DataProviderJpaAdapter
#   Controller:              <Noun>Controller            — e.g. UserController
#   Persisted entity:        <Noun>Entity                — e.g. UserEntity
#   Cross-layer mapper:      <Noun>Mapper                — e.g. UserMapper
#
# References used to design this blueprint (not loaded automatically,
# for human reference only):
#   @.claude/blueprints/clean-architecture/references/descomplicando-dev-to.md
#   @.claude/blueprints/clean-architecture/references/porto-seguro-medium.md

dependency_rules:
  direction: inward
  forbidden:
    - from: domain
      to: [application, infrastructure, commons]
      reason: "The domain does not know about use cases or infrastructure — commons included: it carries Spring AOP/AspectJ/Lombok framework code, and domain stays framework-free"
    - from: application
      to: [infrastructure]
      reason: "The application depends on ports (interfaces), not on infrastructure implementations"

# Real, compilable exemplars (not templates to swap mechanically).
# The project base comes from Spring Initializr; these files provide the SHAPE.
templates:
  parent_pom: templates/pom.parent.xml.example
  module_pom: templates/pom.module.xml.example
  module_docs: templates/module.AGENTS.md.example
  settings: templates/settings.json.example

features:
  rest: true
  validation: true # required with `rest`: api-rest.md requires bean validation on the DTO
  persistence-jpa: true
  uuid-v7: true # persistence.md requires UUID v7 and JDK 21 only generates v4
  flyway: true
  messaging-kafka: false
  openapi: true
  testcontainers: true
  actuator: true
  observability: true # tracing bridge; without it the 5xx traceId is degraded (observability.md)
  archunit: true # data read by the `test-architect` skill; the bootstrap does not generate architecture tests

id: hexagonal
name: Hexagonal (Ports & Adapters)
description: >
  Domain at the center, ports as interfaces, input and output adapters at the edges.
when_to_choose:
  - More than one input or output channel (REST + messaging + batch)
  - Need to swap infrastructure without touching the domain
  - Use case tests without spinning up the Spring context
trade_offs:
  - More modules and more explicit mapping than layered
  - Steeper entry curve for newcomers to the project
  - Overkill for simple CRUD

build:
  layout: multi-module
  tool: maven

# Globs that identify the code covered by `rules/architecture-ddd.md` (DDD +
# dependency direction). They go verbatim into the `paths` frontmatter of the file the
# bootstrap generates at <project>/.claude/rules/architecture-ddd.md — they are not
# inferred from `modules[].path`, because not every blueprint uses the same directory
# names.
architecture_paths:
  - "domain/**/*.java"
  - "application/**/*.java"
  - "adapters/**/*.java"
  - "bootstrap/**/*.java"
  - "commons/**/*.java"

modules:
  - id: domain
    path: domain
    depends_on: []
    forbidden_imports:
      - "org.springframework.."
      - "jakarta.persistence.."
      - "jakarta.validation.."
      - "com.fasterxml.jackson.."
      - "tools.jackson.."  # Jackson 3 (Spring Boot 4) core; annotations stay under com.fasterxml.jackson
  # Cross-cutting infra (logging/masking annotations + AOP aspects, see rules/logging.md)
  # — not business code. A leaf, same as `domain`, but on the other side of the
  # zero-framework line: everything else depends on it, `domain` never does. Bootstrap
  # only creates the empty package-info; the real classes are installed once, later, by
  # the `commons-logging-installer` agent — @.claude/decisions (this repo only).
  - id: commons
    path: commons
    depends_on: []
  - id: application
    path: application
    depends_on: [domain, commons]
    forbidden_imports:
      - "jakarta.persistence.."
      - "org.springframework.web.."
      - "org.springframework.ai.."  # the model suggests through a port; the library stays in adapter.out.ai — decision 0145
  - id: adapter-in-rest
    path: adapters/adapter-in-rest
    depends_on: [application, domain, commons]
    feature: rest
  - id: adapter-out-persistence
    path: adapters/adapter-out-persistence
    depends_on: [application, domain, commons]
    feature: persistence-jpa
  - id: adapter-in-messaging
    path: adapters/adapter-in-messaging
    depends_on: [application, domain, commons]
    feature: messaging-kafka
  - id: adapter-out-messaging
    path: adapters/adapter-out-messaging
    depends_on: [application, domain, commons]
    feature: messaging-kafka
  - id: bootstrap
    path: bootstrap
    depends_on: ["*"]
    contains_main: true

packages:
  base: "{{groupId}}.{{artifactName}}"
  map:
    domain.model: "domain.model"
    domain.event: "domain.event"
    domain.exception: "domain.exception"
    application.port.in: "application.port.in"
    application.port.out: "application.port.out"
    application.service: "application.service"
    adapter.in.rest: "adapter.in.rest"
    adapter.out.persistence: "adapter.out.persistence"
    adapter.in.messaging: "adapter.in.messaging"
    adapter.out.messaging: "adapter.out.messaging"
    commons.logging: "commons.logging"
    # Scheduling triggers compile into `bootstrap` (already depends on every module and
    # is the composition root) until a project needs build isolation for them, at which
    # point an `adapters/adapter-in-scheduling` module is added — decision 0087.
    adapter.in.scheduling: "adapter.in.scheduling"
    # Outbound HTTP adapters (one subpackage per remote system, plus `shared`) — decision 0121.
    # Compiled into `bootstrap` like `adapter.in.scheduling`, until a project needs build isolation
    # for them, at which point an `adapters/adapter-out-http` module is added.
    adapter.out.http: "adapter.out.http"
    # Cache decorators of outbound ports, and the cache wiring — decision 0144. Compiled into
    # `bootstrap` like `adapter.out.http`: a decorator imports only the port it implements, and the
    # composition root already sees the adapter it wraps, by bean name.
    adapter.out.cache: "adapter.out.cache"
    # Outbound AI adapters — a language model or a vector store behind a port, and the AI wiring —
    # decision 0145. Compiled into `bootstrap` like `adapter.out.http`; Spring AI appears nowhere else.
    adapter.out.ai: "adapter.out.ai"

# Naming convention for this blueprint (specific to hexagonal, not universal —
# see .claude/rules/architecture-ddd.md for what IS universal, DDD, and
# .claude/rules/naming.md for the rest):
#   Input port:  <Verb><Noun>UseCase   — e.g. ConfirmOrderUseCase
#   Output port: <Noun><Action>Port        — e.g. OrderRepositoryPort
#   Implementation:    <Verb><Noun>Service     — e.g. ConfirmOrderService
#   Command:     <Verb><Noun>Command   — e.g. ConfirmOrderCommand, a record next to its input port
#   Grouping (one subpackage per aggregate, always — even with a single aggregate):
#                `application.port.in.<aggregate>` and `application.service.<aggregate>`
#                — e.g. application.port.in.order holds ConfirmOrderUseCase and
#                ConfirmOrderCommand, application.service.order holds ConfirmOrderService.
#                A use case lives with the aggregate it writes, a query with the one it
#                reads, the outbox relay and prune use cases in `outbox`; one that touches
#                no aggregate, with the one its trigger concerns (a reaction to
#                OrderConfirmed: `order`), else under the noun of its own name
#                (RequestShippingQuote: `shippingquote`). Same lowercase
#                segment as the persistence adapter's subpackage; the test tree mirrors
#                it. Output ports stay flat (a capability, not a use case), and a type the
#                use cases of several aggregates share (`PageCriteria`, `IdempotentExecution`)
#                stays at the package root

dependency_rules:
  direction: inward
  forbidden:
    - from: domain
      to: [application, "adapters/*", bootstrap, commons]
      reason: "The domain does not know who uses it — commons included: it carries Spring AOP/AspectJ/Lombok framework code, and domain stays framework-free (architecture-ddd.md)"
    - from: application
      to: ["adapters/*", bootstrap]
      reason: "The application depends on ports, not on implementations"
    - from: "adapters/*"
      to: ["adapters/*"]
      reason: "Adapters do not talk to each other — they communicate through the application"

# Real, compilable exemplars (not templates to swap mechanically).
# The project base comes from Spring Initializr; these files provide the SHAPE.
templates:
  parent_pom: templates/pom.parent.xml.example
  module_pom: templates/pom.module.xml.example
  module_docs: templates/module.AGENTS.md.example
  settings: templates/settings.json.example

features:
  rest: true
  validation: true # required with `rest`: api-rest.md requires bean validation on the DTO
  persistence-jpa: true
  uuid-v7: true # persistence.md requires UUID v7 and JDK 21 only generates v4
  flyway: true
  messaging-kafka: false
  messaging-sqs: false
  openapi: true
  testcontainers: true
  actuator: true
  observability: true # tracing bridge; without it the 5xx traceId is degraded (observability.md)
  archunit: true # data read by the `test-architect` skill; the bootstrap does not generate architecture tests

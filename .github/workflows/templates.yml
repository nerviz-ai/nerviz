name: templates

# Proves what the templates a generated project receives verbatim claim about themselves —
# the part `validate` cannot see, because a template never runs in this repository:
#   1. the two Checkstyle configs parse on the current Checkstyle and reject what they claim
#      to reject (lessons-learned-017 § 8: a default `format` passed `record` with 0
#      violations — decision 0097)
#   2. the Java templates copied as files compile in a fresh Initializr project, and the tests
#      shipped with them pass (decisions 0096, 0098)
#   3. the transport templates pass their own integration test once per topology — edge and
#      direct — in a fresh Initializr project (decision 0122)
#   4. the generated CI's "integration tests actually ran" step reads the reports Maven and
#      Gradle really write: @Nested ITs pass it, a Docker-guard skip fails it (decision 0127)
# Design: .claude/decisions/0099-ci-tests-for-verbatim-templates.md
#
# Path-filtered on purpose: every job downloads from Maven Central, GitHub or
# start.spring.io, and the last two run a Maven build. A PR that touches none of the files
# below has nothing for them to prove. This workflow is not a required check — a required
# check on a path-filtered workflow stays pending forever on the PRs it skips.
on:
  push:
    branches: [main]
    # Same list under both triggers — keep them identical.
    paths:
      - '.claude/skills/project-bootstrap/templates/checkstyle*.xml.example'
      - '.claude/skills/new-feature-implement/templates/commons/**'
      - '.claude/skills/persistence-architect/templates/JpaEntity.java.example'
      - '.claude/skills/persistence-architect/templates/MongoDocument.java.example'
      - '.claude/skills/persistence-architect/templates/MongoCollections.java.example'
      - '.claude/skills/persistence-architect/templates/MongoConfig.java.example'
      - '.claude/skills/search-architect/templates/SearchDocument.java.example'
      - '.claude/skills/search-architect/templates/SearchIndexBootstrap.java.example'
      - '.claude/.ci/CheckstyleConfigTest.java'
      - '.claude/.ci/JavaTemplatesTest.java'
      - '.claude/skills/transport-security-setup/templates/**'
      - '.claude/.ci/TransportTemplatesTest.java'
      - '.claude/skills/project-bootstrap/templates/ci.yml.example'
      - '.claude/skills/project-bootstrap/templates/ci-gradle.yml.example'
      - '.claude/skills/project-bootstrap/templates/pom.parent.xml.example'
      - '.claude/skills/project-bootstrap/templates/build.gradle.parent.example'
      - '.claude/.ci/CiItCheckTest.java'
      - '.github/workflows/templates.yml'
  pull_request:
    paths:
      - '.claude/skills/project-bootstrap/templates/checkstyle*.xml.example'
      - '.claude/skills/new-feature-implement/templates/commons/**'
      - '.claude/skills/persistence-architect/templates/JpaEntity.java.example'
      - '.claude/skills/persistence-architect/templates/MongoDocument.java.example'
      - '.claude/skills/persistence-architect/templates/MongoCollections.java.example'
      - '.claude/skills/persistence-architect/templates/MongoConfig.java.example'
      - '.claude/skills/search-architect/templates/SearchDocument.java.example'
      - '.claude/skills/search-architect/templates/SearchIndexBootstrap.java.example'
      - '.claude/.ci/CheckstyleConfigTest.java'
      - '.claude/.ci/JavaTemplatesTest.java'
      - '.claude/skills/transport-security-setup/templates/**'
      - '.claude/.ci/TransportTemplatesTest.java'
      - '.claude/skills/project-bootstrap/templates/ci.yml.example'
      - '.claude/skills/project-bootstrap/templates/ci-gradle.yml.example'
      - '.claude/skills/project-bootstrap/templates/pom.parent.xml.example'
      - '.claude/skills/project-bootstrap/templates/build.gradle.parent.example'
      - '.claude/.ci/CiItCheckTest.java'
      - '.github/workflows/templates.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: templates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkstyle-configs:
    name: checkstyle configs reject what they claim
    runs-on: ubuntu-latest
    # One download and six Checkstyle runs over three small files.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: checkstyle.xml and checkstyle-test.xml against fixtures
        run: java .claude/.ci/CheckstyleConfigTest.java

  java-templates:
    name: verbatim Java templates compile and their tests pass
    runs-on: ubuntu-latest
    # A cold Maven repository: the Boot, JPA and test dependencies download once per run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: commons templates + AssignedIdEntity in a fresh Initializr project
        run: java .claude/.ci/JavaTemplatesTest.java

  transport-templates:
    name: transport templates pass their IT per topology
    runs-on: ubuntu-latest
    # Two fresh Initializr projects (web, actuator), one Maven test run each.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # The TLS case generates its certificate with the runner JDK's keytool; nothing is
      # checked in (.claude/rules/secrets.md § Key material).
      - name: edge and direct topologies in a fresh Initializr project
        run: java .claude/.ci/TransportTemplatesTest.java

  ci-it-check:
    name: generated CI's IT check reads the real reports
    runs-on: ubuntu-latest
    # Two fresh Initializr projects (Maven, Gradle), two builds each: one green, one red.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # The step once failed every build whose IT held its tests in @Nested classes, and
      # never caught the Docker-guard skip it exists for (decision 0127).
      - name: "@Nested ITs pass, a Docker-guard skip fails, on Maven and Gradle"
        run: java .claude/.ci/CiItCheckTest.java

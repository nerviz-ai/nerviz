name: validate

# Proves the claims this template makes about itself:
#   1. the hooks run on Linux, macOS and Windows (decision D8) — and what runs is the
#      committed ArchHook.jar, byte for byte what the source compiles to (0075)
#   2. every guard mode blocks what it claims and lets the rest through, exercised against
#      that jar: territory, `guard bash`, `guard sweep`, `compose gate`, `context subagent`
#      (0084)
#   3. each norm has a single owning file
#   4. adding a blueprint doesn't require touching skills, agents or commands
#   5. the transformation into a project's `.claude/` is reproducible, carries the jar, and
#      deletes what `export.retired` names (decision D54, 0082)
#   6. every service template docker-architect merges yields a valid compose file (0092)
#   7. every mod under .claude/mods/ is structurally what `mods` in extensions.json allows —
#      its TypeScript runs in mods.yml (0131)
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

# Nothing here writes: every job reads the checkout and runs `java`. The default token
# permission is whatever the repository settings grant (write, unless restricted), and a
# workflow that never needs it shouldn't carry it.
permissions:
  contents: read

# `push: [main]` and `pull_request` both fire on the same head when a PR branch is
# pushed. Superseded runs are cancelled instead of racing the new one to the same
# conclusion.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks-cross-platform:
    name: hooks · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Each step is one `java` invocation over a handful of files. A run that passes ten
    # minutes is hung, and without this it would hold a runner for the 6h default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Pinned by commit SHA, not by tag: `@v7` is a moving branch-like ref the action's
      # owner can repoint, so a tag pin makes what CI ran unreproducible. The trailing
      # comment is the human-readable half — bump both together.
      #
      # Both actions are on their current major. v1–v4 of setup-java are deprecated, and
      # the majors in between only tighten things this workflow doesn't use: node24 (needs
      # runner ≥ v2.327.1, which GitHub-hosted runners are), the fork-PR checkout block
      # that applies to `pull_request_target`/`workflow_run` and not to the `pull_request`
      # trigger above, and setup-java v6 dropping the legacy `adopt` distributions —
      # `temurin` below is unaffected.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Same line on all three OSes. No shell, no chmod, no variants.
      - name: doctor
        run: java .claude/hooks/ArchHook.java doctor

      # Every hook launches the committed ArchHook.jar, which a reviewer cannot read. A
      # fresh compile under the pinned JDK must reproduce it byte for byte on all three
      # OSes — the check that tells a tampered jar from a stale one
      # (.claude/decisions/0075-precompiled-hook-jar.md).
      - name: committed ArchHook.jar is what the source compiles to
        run: java .claude/hooks/ArchHook.java build --verify

      - name: the jar runs what the hooks run
        run: java -jar .claude/hooks/ArchHook.jar doctor

      # Every test below spawns `java -jar .claude/hooks/ArchHook.jar`, the exact command the
      # registrations run — the step above is what makes that the same thing as the source.
      # Both shapes: the stdin payload the hook sends, and `check <path>` — what the bootstrap's
      # boundary probe types — which once read stdin first and hung, then passed in silence (0123).
      - name: hook blocks forbidden import, from the payload and from argv
        run: java .claude/.ci/BoundaryTest.java

      # Issue #60: `moduleOf` never looked at the root POM, so `format`, `check` and `tests`
      # returned before calling Maven in every single-module project, silently (0107).
      - name: format, check and tests hand Maven the module the edited file belongs to
        run: java .claude/.ci/ModuleMapTest.java

      # Issue #76: a main-thread Stop fired while a background executor wrote src/, ran Maven
      # over its half-written tree and blocked a thread that cannot write src/ (0116). A marker
      # never written brings that back; one never cleared turns the gate off — both silent.
      # 0130 chains three executor groups: the gate must stay deferred across the handover.
      - name: tests defers while a writer subagent of the session runs, and only then
        run: java .claude/.ci/TestsDeferTest.java

      # lessons-learned-010 § 5: a cwd-relative injection reports a file as absent while
      # it exists, and that false negative arms the entry guard of the skill it's in.
      - name: hook blocks a cwd-relative frontmatter injection
        run: java .claude/.ci/InjectionPathTest.java

      # Decision 0104: `arch-adopt` reads the `migrations` block with the model, so a
      # misspelled blueprint id or a reused id means a project is never told its code
      # predates a convention change — with no error anywhere.
      - name: schema blocks a migrations entry no project would see
        run: java .claude/.ci/MigrationsSchemaTest.java

      # Question 3 of the `compose` mode reads two files and needs no Docker, so it runs
      # on all three OSes — including the two runners with no daemon. The test also proves
      # the `src/test/` path match survives Windows' separator.
      - name: hook reports a compose image tag that disagrees with src/test
        run: java .claude/.ci/ComposeTagTest.java

      # lessons-learned-012 §§ 12, 13: a design run wrote a service into docker-compose.yml,
      # which the old denylist (`src/**`) could not see. Territory is deny-by-default now,
      # and that claim rots silently the first time a `write_allow` is widened by accident.
      - name: guard keeps each skill inside its class's territory
        run: java .claude/.ci/SkillTerritoryTest.java

      # The same claim one layer lower: each agent used to promise its territory in prose
      # (`**Does not write:** docker-compose.yml`) while the guard gave it an unconditional
      # bypass. `agent_classes` turns the promise into data keyed on `agent_type`.
      - name: guard keeps each agent inside its class's territory
        run: java .claude/.ci/AgentTerritoryTest.java

      # Runs before EVERY shell command in every session: too loose and a `-uf` or
      # `sh -c "…"` walks past the force-push refusal 0076 promised, too tight and it blocks
      # `ls`. Both directions are data in `guard.force_push` / `guard.bash_write_shapes`.
      - name: guard bash refuses force pushes and holds shell writes to the phase
        run: java .claude/.ci/BashGuardTest.java

      # lessons-learned-022 § 2: the Copilot CLI reads .claude/settings.json, runs `command` and
      # ignores `args`, so exec form launched a bare `java` — exit 1, which on preToolUse denies
      # every call. Each registration runs here as exec form, as Claude Code's shell form and as
      # Copilot's, on Claude's and Copilot's payloads: same exit, same stdout, 0 or 2 (0168).
      # Git Bash on the Windows runner, the shell Claude Code itself picks there.
      - name: every hook registration runs the same under Claude Code and the Copilot CLI
        run: java .claude/.ci/HookShellFormTest.java

      # The Copilot CLI sends every write as `Edit` with the patch as a string and no
      # `file_path`, so the write hooks saw nothing (lessons-learned-022 § 3). The patch is
      # translated into Claude Code's payloads; this holds the translation on the captured
      # patches — frozen spec, territory, boundary, formatter, schema, trail — and exit 0 on
      # what it cannot read (0169).
      - name: the write hooks read the Copilot CLI's apply_patch
        run: java .claude/.ci/ApplyPatchTest.java

      # The only filesystem-shaped guard (0065). Needs `git`, which every runner has. It skips
      # what a tool-time guard admitted, so a cross-class chain does not re-judge the run's
      # own writes against the narrower phase open at Stop (0114, issue #74).
      - name: guard sweep reports this turn's writes, never pre-existing dirt
        run: java .claude/.ci/SweepTest.java

      # The cockpit mod draws the band above the prompt from this one JSON line; its own tests
      # stub it, so a renamed key would empty the band with nothing failing (0131).
      - name: guard status prints the open phase the cockpit draws
        run: java .claude/.ci/GuardStatusTest.java

      # A mod that hooks an unknown event, gates without `.catch`, calls the network or the
      # model, or that the marketplace or settings forgot, loads half-way in silence. The
      # `mods` workflow runs the TypeScript; this is the half that runs on every OS (0131).
      - name: schema blocks a mod that would load half-way
        run: java .claude/.ci/ModsSchemaTest.java

      # The advertised-address half of the gate reads the file, so it blocks on all three
      # OSes whether or not a Docker daemon is present (0064). Question 5 — a placeholder the
      # host run or the `app` container cannot reach — reads files the same way (0110).
      - name: compose gate blocks a published service no host client can reach
        run: java .claude/.ci/ComposeGateTest.java

      # The generated project's "architectural boundaries" job is `doctor gate`. The bare
      # `doctor` only prints, so that job went green on ENFORCEMENT OFF (issue #104, 0128).
      # Each line `doctor.gate.labels` names must fail the gate and runner-state lines must
      # not; a renamed label drops out of the gate in silence, so the test fails on that too.
      - name: doctor gate fails on every gated line and only on those
        run: java .claude/.ci/DoctorGateTest.java

      # A plugin enabled at user level loads again, in silence, the moment its project-level
      # `false` is gone; the list sits in two settings files and drifts on the first edit to
      # one of them. `settings.blocked_plugins` is the owner, and both files must follow (0138).
      - name: schema blocks a settings file that re-enables a colliding plugin
        run: java .claude/.ci/PluginBlockTest.java

      # A personal skill named like one of the project's replaces it with no warning. Nothing
      # in the project can refuse the personal directory, so doctor reports it — and, being a
      # developer's machine state, it must never fail the gate (0138).
      - name: doctor names a personal skill that shadows a project skill, and never gates
        run: java .claude/.ci/SkillShadowTest.java

      # A module's facts now live in its AGENTS.md, and Claude Code loads it only through the
      # one-line CLAUDE.md next to it — a module AGENTS.md alone is skipped while the root has
      # a CLAUDE.md, in silence. The files are rendered by the model, so doctor checks them
      # against the blueprint copy; it reports, never gates (0139).
      - name: doctor checks the agent instruction files against the blueprint, and never gates
        run: java .claude/.ci/AgentInstructionsTest.java

      # Virtual threads are the norm on a JDK 21+ build (.claude/rules/virtual-threads.md), set in
      # advance with no failure observed, and a profile may turn them off with a reason — so doctor
      # warns from the build file's target JDK, Maven and Gradle, and never gates (0155).
      - name: doctor warns when a JDK 21+ build lacks virtual threads, and never gates
        run: java .claude/.ci/VirtualThreadsDoctorTest.java

      # arch-adopt installed this .claude/ into a Boot 3 project with no warning, and what it
      # wrote does not apply there. `export` now refuses a build below `doctor.platform.min_line`
      # before writing a byte, and doctor reports the same line, never gated (0161).
      - name: export refuses a Spring Boot line below the floor, and doctor reports it
        run: java .claude/.ci/PlatformLineTest.java

      # The generated project's `boundaries` job is `doctor gate`, and `Boundary violations` is
      # the one gated line that reads code: it sweeps every source file with check's own match.
      # A sweep that matched nothing would read as a clean project, under any agent (0140).
      - name: doctor sweeps every source file for forbidden imports, with check's own match
        run: java .claude/.ci/BoundarySweepTest.java

      # `boundary-map` is the one derivation of a generated project's forbidden-imports.txt: a
      # blueprint whose rules derived to nothing, or to a prefix `check` never matches, generated a
      # project that looked guarded and blocked nothing. Every blueprint, then `check` on the map (0166).
      - name: boundary-map derives every blueprint's rules, and check enforces them
        run: java .claude/.ci/BoundaryMapTest.java

      # What export tells the person who runs it: `Overwrites` only for a file that exists and
      # changes, and a stamp whose commit is the one given, the source's own HEAD, the fetch
      # marker's in a tree new-project extracted (0163), or "unknown" — never a parent
      # repository's. report-issue reads that commit (0141).
      - name: export notes only real overwrites, and never guesses the stamp's commit
        run: java .claude/.ci/ExportProvenanceTest.java

      # SubagentStart cannot block and an empty stdout is legal: a catalog that stops
      # arriving, or starts arriving everywhere, fails silently (0077).
      - name: context subagent hands the catalog to pattern_catalog agents only
        run: java .claude/.ci/SubagentContextTest.java

      # Everything `audit` reports about where a run spent is parsed from an undocumented
      # transcript layout, and a render that throws exits 0 — the report just freezes (0041).
      # The error text it quotes lands in a versioned file, so the redaction is checked too (0085).
      # Which pieces it skips is a class flag, `audited: false` — removing it must fail here (0086).
      # A project's audited.json overrides the class per piece; arch-adopt's own override is fixed
      # off and out of its reach — dropping either read must fail here (0111).
      # Each piece's cache split and the calls whose results later requests re-read the most are
      # what a cut to the executor is chosen from — attributing growth to the wrong request, or
      # counting re-reads past a compaction, must fail here (0132).
      # Runs per plan window divide the project's Pro budget by a run's billable tokens — reading
      # another plan's multiplier, or dropping the time cap, must fail here (0133). The trail
      # prices nothing: a cost cell or ledger field coming back must fail here too (0134).
      - name: audit renders where the run spent, redacts tool errors, skips what class or project turns off
        run: java .claude/.ci/AuditRenderTest.java

      # GENESIS's Started, Finished and tokens come only from `audit genesis` reading the
      # transcripts — a start once landed after the finish, written by the model (0123). A sum
      # that counts turns from before `/init-project`, or a second run overwriting, must fail here.
      - name: audit genesis fills GENESIS from the transcripts, once
        run: java .claude/.ci/GenesisTest.java

  design:
    name: design invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The runner default is `bash -e {0}` — no `pipefail`. Without it the failure of the
    # first command in `$(grep … | grep -v … || true)` is invisible and the step passes on
    # a broken pipeline. Declared per job, never at workflow level: the
    # `hooks-cross-platform` matrix has a `windows-latest` leg whose default shell is pwsh.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: frontmatter schema (extensions.json is the single owner — invariant 10)
        run: java .claude/hooks/ArchHook.java schema

      # `claude plugin validate` isn't run here: the CLI isn't on the runner, and
      # installing it would add a dependency outside java/git/curl (see CLAUDE.md §
      # Dependencies). It's a local-only, human-run complement — see docs/pt-br/07-ci-validate.md.
      #
      # A skill folder named after a native slash command used to be a step here, over a
      # list that lived only in this YAML and that a generated project never ran. The list
      # is `types.skill.native_commands` now, and `schema` above fails on it (0084).

      - name: decisions/ doesn't grow paths or enter 00-index.md
        run: |
          FAIL=0
          if grep -l "^paths:" .claude/decisions/*.md 2>/dev/null; then
            echo "❌ A file in decisions/ declares paths: — that makes it auto-load like a rule."
            echo "   decisions/ is history: no paths, records what was decided, not what holds today."
            FAIL=1
          fi
          for f in .claude/decisions/*.md; do
            n=$(basename "$f")
            if grep -q "$n" .claude/rules/00-index.md; then
              echo "❌ $n is listed in 00-index.md — decisions/ isn't a rule and has no owning entry there."
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "✅ decisions/ carries no paths and isn't indexed as a rule."
          exit $FAIL

      # Citing a specific decision record from a rule/skill ("Recorded in
      # decisions/00NN-...") is the normal, established pattern here — it's how a
      # norm points to the reasoning behind it. What invariant 8 forbids is a
      # version written as fact to *use*, not a dated note of what was last verified.
      - name: no hardcoded Spring/Java version outside decisions/ (invariant 8)
        run: |
          FAIL=0
          HITS=$(grep -rnE "Spring Boot [0-9]+\.[0-9]+|Java (1[0-9]|2[0-9])\b" \
                   .claude/rules .claude/skills .claude/blueprints CLAUDE.md 2>/dev/null \
                 | grep -v "JDK 21+" \
                 | grep -v "Tested to compile" || true)
          if [ -n "$HITS" ]; then
            echo "❌ A version is written from memory instead of resolved via Spring Initializr:"
            echo "$HITS"
            FAIL=1
          fi
          [ "$FAIL" -eq 0 ] && echo "✅ No hardcoded Spring/Java version outside decisions/ and dated test notes."
          exit $FAIL

      - name: new blueprint doesn't touch prompts
        run: |
          cp .claude/blueprints/custom-template/custom.template.yaml .claude/blueprints/_ci-probe.yaml
          CHANGED=$(git status --porcelain .claude/skills .claude/agents)
          rm .claude/blueprints/_ci-probe.yaml
          if [ -n "$CHANGED" ]; then
            echo "❌ Adding a blueprint changed prompts:"; echo "$CHANGED"; exit 1
          fi
          echo "✅ Blueprints are data, not prompts."

      - name: rules is a leaf of the graph
        run: |
          if grep -rniE "\bskills?\b|\bagents?\b|\bsubagents?\b" .claude/rules/ ; then
            echo "❌ A rule mentions a skill or agent. rules/ references no one."
            exit 1
          fi
          echo "✅ rules/ is a leaf."

      - name: norm contains no code boilerplate
        run: |
          if grep -rnE "^\s*(public|protected)\s+(abstract\s+|final\s+)?(class|record|interface|enum)\s" .claude/rules/ ; then
            echo "❌ Class declaration inside a rule."
            echo "   Boilerplate lives in skills/<name>/templates/*.example, not in rules/."
            exit 1
          fi
          echo "✅ No classes declared in rules/. Short illustrative snippets are allowed."

      - name: no new commands/
        run: |
          if [ -d .claude/commands ]; then
            echo "❌ .claude/commands/ exists. Slash commands live as skills with"
            echo "   disable-model-invocation: true."
            exit 1
          fi
          echo "✅ No commands/."

      - name: exemplars have the .example suffix at the end
        run: |
          BAD=$(find .claude/skills -path '*/templates/*' -type f ! -name '*.example')
          if [ -n "$BAD" ]; then
            echo "❌ Exemplar without the .example suffix at the end (escapes the precondition glob):"
            echo "$BAD"; exit 1
          fi
          echo "✅ Uniform exemplar naming."

      # The executor copies an exemplar's shape, comments included, and the generated
      # project's Checkstyle rejects every comment but Javadoc (code-quality.md § Comments).
      # A comment that returns to a template body is a red `check` hook in every project that
      # copies it. Reads its patterns from checkstyle.xml.example, so the two never disagree (0108).
      - name: exemplar bodies carry no comment but Javadoc
        run: java .claude/.ci/TemplateCommentsTest.java

      # Every DEBUG line bank-app carried came from a template: a rejection logged where production
      # never sees it, and a parser's exception that can echo the body. A template is never a case
      # that asked for DEBUG (0157).
      - name: exemplars log no DEBUG/TRACE and rejections at WARN without the exception
        run: java .claude/.ci/TemplateLogLevelTest.java

      # lombok.md once listed @RequiredArgsConstructor as allowed and never named @Slf4j, so the
      # templates wrote the logger and 75 plain-assignment constructors by hand, and 73 files left
      # out the @FieldDefaults the same norm required. The executor copies the shape it sees (0158).
      - name: exemplars let Lombok write the logger, the plain constructor and the field modifiers
        run: java .claude/.ci/TemplateLombokTest.java

      # `hexagonal-single-module` lists its ten adapter packages against each other by hand (a package
      # has no `adapters/*` wildcard), and the `check` hook of a generated project refuses an import the
      # derived map forbids. A typo in that matrix, or an exemplar importing a sibling adapter, ships
      # into every project that chose the blueprint (0165). No network.
      - name: exemplars keep the adapters of hexagonal-single-module apart, and its matrix is complete
        run: java .claude/.ci/HexagonalSingleModuleTemplateTest.java

      # `blueprints.yml` generates only the blueprints a change can affect, and the rule that picks
      # them lives in the test it runs: a bad rule either skips a blueprint a change broke or
      # generates nine for a typo. This step holds the rule on synthetic path lists, with no git and
      # no network, so it runs on every push (0166).
      - name: the blueprints workflow generates only what a change impacts
        run: java .claude/.ci/BlueprintSkeletonTest.java selftest

      # A MapStruct exemplar is the shape the executor writes and the installer converts to in every
      # project that chose MapStruct; a forbidden construct there ships into all of them, and a
      # skill with only the manual exemplar leaves the MapStruct one improvised (0160).
      - name: MapStruct mapper exemplars hold mapping.md § Forbidden and pair every manual one
        run: java .claude/.ci/MapperTemplateTest.java

      # An XML exemplar is copied in its own order, declaration included. logback-spring.xml's
      # `<?xml … ?>` once sat below its EXEMPLAR comment — a fatal parse error that turned every
      # Spring-context test red in the generated project, patched by hand there (0123).
      - name: XML exemplars are well-formed
        run: java .claude/.ci/XmlTemplatesTest.java

      # A spec template is the only source of a spec's shape (0115), so a diagram that drifts
      # from its own text there ships into every spec generated from it. Holds the templates'
      # Mermaid blocks to spec-diagrams.md: allowed types, names from the text, one message per
      # flow step (0143). Generated specs are not checked — nothing under .claude/.ci/ travels.
      - name: spec template diagrams name only what their text defines
        run: java .claude/.ci/SpecDiagramTemplateTest.java

      # Every default of a cache library is a silent choice — no expiry, no size bound, Java
      # serialization, a cache error failing the read, eviction before the commit — and the
      # executor copies an exemplar's shape. Holds the cache exemplars to caching.md and keeps
      # every other exemplar from caching at all (0144).
      - name: cache exemplars decide every library default, and only they cache
        run: java .claude/.ci/CacheTemplateTest.java

      # Every default of Spring AI is a silent choice — a model nobody pinned, a 60 s per-request
      # timeout that overrides the configured one, a threshold that accepts every item, a
      # prompt-logging flag, a retry block the OpenAI model never reads — and the executor copies
      # an exemplar's shape. Holds the AI exemplars to ai.md, keeps every other exemplar off the AI
      # library, and every blueprint's application layer off it too (0145).
      - name: AI exemplars decide every library default, and only they reach the library
        run: java .claude/.ci/AiTemplateTest.java

      # Spring for GraphQL and graphql-java turn no limit on by default — no depth, no complexity,
      # no timeout, an unbounded batch, introspection on, a schema inspection that only logs — and a
      # resolver that loads a child per parent passes every functional test. The executor copies an
      # exemplar's shape. Holds the GraphQL exemplars to api-graphql.md, keeps every other exemplar
      # off the GraphQL libraries, and every blueprint's inner layers off them too (0146).
      - name: GraphQL exemplars decide every limit and batch every child list
        run: java .claude/.ci/GraphQlTemplateTest.java

      # MongoDB's defaults are silent: `save` without `@Version` upserts the whole document, a class
      # without `@Document("…")` names its own collection, `@Indexed` with index creation off is a
      # unique key that does not exist, a standalone container refuses every transaction. The
      # executor copies an exemplar's shape. This keeps the document family's exemplars, the
      # MongoDB IT and compose service, and every blueprint's inner layers decided (0147).
      - name: document-family exemplars name collection, alias and version, and run a replica set
        run: java .claude/.ci/PersistenceTemplateTest.java

      # Spring Data Elasticsearch's defaults create the index at startup, infer field types, write a
      # type hint and the id into `_source` that a strict mapping refuses, and refresh on every
      # repository save; a bulk without the source's version overwrites a newer copy. This keeps the
      # search exemplars, the search IT and compose services, and every blueprint's package and
      # inner layers decided (0147).
      - name: search exemplars keep the index a strict, versioned projection
        run: java .claude/.ci/SearchTemplateTest.java

      # Envers' and Spring Data auditing's failures are late and quiet: a bag writes a duplicate
      # once in the history, a NOT NULL `_aud` column breaks the first delete, an Instant revision
      # timestamp breaks every update's commit, a prune by the revision's timestamp deletes the
      # version in force, a rolled-back test sees no history. This keeps the auditing exemplars,
      # the audit IT and every blueprint's inner layers decided (0149).
      - name: auditing exemplars keep the history whole, its actor named and its prune safe
        run: java .claude/.ci/AuditTemplateTest.java

      # An API version spelled in one place works until the first `/v2`, then fails silently: a class
      # mapping under the configured prefix serves `/api/v1/api/v1/...`, a request rule on `/api/v1/…`
      # leaves the `/v2` of a protected route to "authenticated", a path set of protected POSTs lets
      # the `/v2` skip the key check — and a prefix `/api/{version}` or one scoped by annotation alone
      # breaks the OpenAPI document. Keeps every REST exemplar versioned from one configuration (0150).
      - name: REST exemplars version every handler from one configuration
        run: java .claude/.ci/ApiVersionTemplateTest.java

      # Every inbound admission trap is silent: a limiter registry per caller never forgets one and
      # names each in a metric, a limiter or cap that waits holds the thread it protects, a quota
      # not divided per replica multiplies by the replica count, a bulkhead named like an outbound one
      # shares its permits, an @Order on IdempotencyAspect lets a rejected call claim the key, and a
      # slice test of the cap passes with the cap absent. Keeps the admission exemplars honest (0151).
      - name: admission exemplars keep one bounded limiter per caller and an inbound cap ahead of idempotency
        run: java .claude/.ci/AdmissionTemplateTest.java

      # Every Kafka consumer trap is silent: a listener that loops and sleeps holds the partition and
      # dead-letters on an interrupt, a forgotten acknowledge() leaves an offset behind, an
      # optimistic-lock failure thrown as a plain ConflictException is dead-lettered unretried, a
      # classification read from errorCode() has no non-blocking form, and an unconditional
      # @LogExecution does not compile without commons logging. Keeps the consumer exemplars honest (0159).
      - name: Kafka consumer exemplars leave retry and commit to the container and retry a lost race
        run: java .claude/.ci/MessagingRetryTemplateTest.java

      # Every AsyncAPI trap is silent and yields a document that looks right: Springwolf's own listener
      # scanner left on documents a header this wire never carries, an annotation on the relay's sender
      # documents no payload, a publisher that is no bean is never scanned, UI publishing left on, a servers
      # block that differs per environment, a pinned generator version. Keeps the exemplars honest (0162).
      - name: AsyncAPI exemplars annotate both sides explicitly and gate the served document against a snapshot
        run: java .claude/.ci/AsyncApiTemplateTest.java

      - name: blueprint-declared templates exist on disk
        run: |
          FAIL=0
          for bp in .claude/blueprints/*/*.yaml; do
            grep -oE '(templates/[A-Za-z0-9._-]+)' "$bp" | sort -u | while read -r t; do
              if [ ! -f ".claude/skills/project-bootstrap/$t" ]; then
                echo "❌ $bp points to $t, which does not exist."; exit 1
              fi
            done || FAIL=1
          done
          [ "$FAIL" -eq 0 ] && echo "✅ Every templates.<role> resolves to a real file."
          exit $FAIL

      # A skill that files issues here fetches its issue form from this repository's HEAD
      # at run time (report-issue, decision 0103; sonar-lessons before it, 0100) — from inside
      # projects exported long ago, which carry their own copy of the skill and not of the
      # form. Renaming or deleting the form breaks every one of them at once, and nothing in
      # this repository shows it: the skill updated alongside the rename works, the copies
      # already out there 404.
      - name: issue forms cited by skills exist
        run: |
          FAIL=0
          for f in $(grep -rhoE '\.github/ISSUE_TEMPLATE/[A-Za-z0-9._-]+\.ya?ml' .claude/skills | sort -u); do
            if [ ! -f "$f" ]; then
              echo "❌ A skill fetches $f, which does not exist."
              echo "   Projects already exported fetch it from this repository's HEAD: keep the"
              echo "   form at its old path, or the skill in every one of them stops at the fetch."
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "✅ Every issue form a skill fetches exists."
          exit $FAIL

      # Only within rules/: duplication between NORMS is the bug. A skill citing the
      # norm is the correct direction of the graph, and an exemplar may repeat the
      # text of the invariant it illustrates.
      # Every service template docker-architect merges, merged at once into the base compose
      # project-bootstrap writes, and parsed by `docker compose config`. Nothing else reads
      # these files before a generated project's `docker compose up`: a wrong indentation or a
      # named volume a template uses without declaring surfaced only there. Needs the Compose
      # plugin the Ubuntu runner ships, no daemon. A template that starts its service at column
      # 0 is re-indented, since the skill merges "indentation matched to the file's own".
      # The database templates read their passwords with `${DB_PASSWORD:?…}` and no default
      # (decision 0124, `rules/secrets.md`): the step exports throwaway values the way a
      # developer's `.env` would, and fills `{{DB_NAME}}` the way docker-architect step 4.5
      # does. Unset, `config` fails naming the variable — which is the point of `:?`.
      - name: compose service templates merge and parse
        env:
          DB_PASSWORD: ci-only
          DB_ROOT_PASSWORD: ci-only
          REDIS_PASSWORD: ci-only
          MONGO_PASSWORD: ci-only
          SEARCH_PASSWORD: ci-only
        run: |
          set -euo pipefail
          T=.claude/skills/docker-architect/templates
          OUT=$(mktemp -d)/docker-compose.yml
          service() {
            awk '/^# ---/{exit} /^volumes:/{exit} {print}' "$1" \
              | awk 'BEGIN{i=-1} /^[^#[:space:]]/{if(i<0)i=0} /^  [^#[:space:]]/{if(i<0)i=2} {print (i==0 && $0 !~ /^#/ ? "  " $0 : $0)}'
          }
          volumes() {
            awk '/^# ---/{exit} /^volumes:/{v=1;next} v&&/^[^[:space:]]/{v=0} v&&/^  [A-Za-z0-9_.-]+:/' "$1"
          }
          {
            grep -v '^#' .claude/skills/project-bootstrap/templates/docker-compose.yml.example
            for f in "$T"/*-service.yml.example; do service "$f"; done | sed 's/{{DB_NAME}}/ci_app/g'
            echo "volumes:"
            for f in "$T"/*-service.yml.example; do volumes "$f"; done | sort -u
          } > "$OUT"
          if ! docker compose -f "$OUT" config -q; then
            echo "❌ A service template in $T does not merge into a valid compose file."
            echo "   Fix the template, not this step: a named volume it uses goes under its own"
            echo "   top-level \`volumes:\`, and the service block is a key under \`services:\`."
            exit 1
          fi
          echo "✅ $(ls "$T"/*-service.yml.example | wc -l | tr -d ' ') service templates merge into the base compose and parse."

      - name: each norm has a single owner
        run: |
          FAIL=0
          # Each term is a phrase only its owning norm may hold: the transport terms belong to
          # transport-security.md, the placeholder rule to secrets.md, which four norms used to
          # restate (0122).
          for term in "Constructor injection" "Zero framework" "RuntimeException" \
                      "forward-headers-strategy" "reload-on-update" "A placeholder for a secret has no default"; do
            HITS=$(grep -rl "$term" .claude/rules/ || true)
            N=$(echo "$HITS" | grep -c . || true)
            if [ "$N" -gt 1 ]; then
              echo "❌ '$term' is a rule written in $N files under rules/:"
              echo "$HITS"; FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "✅ No duplicated rules between files in rules/."
          exit $FAIL

      - name: no dependencies outside the Java ecosystem
        run: |
          if grep -rn --include="*.json" --include="*.yaml" --include="*.sh" \
               --exclude="settings.local.json" \
               -E "pip install|python3? |npm install|node " .claude/ ; then
            echo "❌ Dependency outside the Java ecosystem (see decision D7)."; exit 1
          fi
          echo "✅ Only JDK, Maven, git and curl."

      # Gap 8 of lessons-learned-001: `api-rest.md` declared `**/adapter/in/rest/**`, which
      # two of the three blueprints don't have. The norm never entered context and nothing warned.
      - name: every norm `paths` matches some blueprint
        run: |
          FAIL=0
          for norma in .claude/rules/*.md; do
            # Only the first occurrence: `paths:` lives in the frontmatter, at the top of the file.
            # `next` required after the print: gsub rewrites $0, and without it the already
            # cleaned line would stop matching `^  - ` and fire the exit one line too
            # early — only the first glob of each rule was checked.
            GLOBS=$(awk '/^paths:/{f=1;next}
                         f&&/^  - /{s=$0; sub(/^  - /,"",s); gsub(/["[:space:]]/,"",s); print s; next}
                         f{exit}' "$norma")
            [ -z "$GLOBS" ] && continue
            # One glob per line, read whole: an unquoted `for glob in $GLOBS` would expand
            # `**/*.yml` against the tree.
            while IFS= read -r glob; do
              # Layout-independent globs: valid in any blueprint, don't have to
              # match any declared package. `**/src/**/*.java` is the Java-wide glob since
              # decision 0082; `**/*.java` is not allowed through — it also matched
              # ArchHook.java, and a rule reintroducing it fails here as an unknown package.
              # A `.claude/` glob — 00-index.md's — targets this tree, not a package.
              # The list is data, `export.derived_paths.derived_paths_exempt_globs` in
              # extensions.json — the same one `schema` reads, so the two checks cannot disagree.
              # A glob is compared whole and literally (`-F -x` over one glob per line).
              EXEMPT=$(grep -o '"derived_paths_exempt_globs": \[[^]]*\]' .claude/schemas/extensions.json \
                        | sed -e 's/^[^[]*\[//' -e 's/\]$//' | tr ',' '\n' | sed -e 's/^ *"//' -e 's/" *$//')
              if printf '%s\n' "$EXEMPT" | grep -qFx -- "$glob"; then continue; fi
              case "$glob" in
                .claude/*) continue ;;
              esac
              # `**/adapter/in/rest/**` → `adapter.in.rest`, which is how packages.map
              # writes it. A glob shorter than the declared package counts as a match:
              # `**/domain/**` covers `domain.model`, and that's legitimate territory.
              PKG=$(echo "$glob" | sed -e 's|^\*\*/||' -e 's|/\*\*.*$||' -e 's|/\*.*$||' -e 's|/|.|g')
              PKG_RE=$(echo "$PKG" | sed 's|\.|\\.|g')
              if ! grep -rqE ": \"?${PKG_RE}(\"|\\.|$)" .claude/blueprints/*/*.yaml; then
                echo "❌ $norma: glob '$glob' points to '$PKG', which no"
                echo "   packages.map declares. The rule never auto-loads where that"
                echo "   package doesn't exist, and the failure mode is silent."
                FAIL=1
              fi
            done <<< "$GLOBS"
          done
          [ "$FAIL" -eq 0 ] && echo "✅ Every rule glob has a matching package in a blueprint."
          exit $FAIL

      # Two checks used to live here, grepping the copy tables that steps 6.6/6.7/6.8 of
      # `project-bootstrap` carried in prose: that a rule with a territory appears in the
      # derivation table, and that every rule, skill and agent has a row in the copy
      # list. Those tables are gone — the `export` block of `.claude/schemas/extensions.json`
      # is the single owner now (D54) — and both checks moved into `ArchHook.java schema`,
      # which the step above runs: `include`/`exclude` must cover every skill and agent on
      # disk, and a rule whose `paths` names a package must have an entry in
      # `derived_paths`. Same guarantee, one owner, and it also fires locally on every
      # edit under .claude/ instead of only in CI.

  export-determinism:
    name: export is reproducible and self-contained
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    # The `export` mode is the single implementation of what used to be prose in steps
    # 6.6/6.7/6.8/7 of `project-bootstrap`, and from stage 2 of D54 it runs on other
    # people's machines, pulled by `arch-adopt`. Two properties have to hold there and
    # cannot be checked by reading the diff of a PR: the same input produces the same
    # tree, and the tree carries nothing that only exists in this repository. No example
    # project is versioned to diff against — a checked-in tree would only prove that the
    # tree matches itself, and the sibling demo repository measures accumulated drift,
    # not correctness (D54 § Stages).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Every blueprint, not just one: the `paths` derivation reads `packages.map`, and a
      # package name that only one architecture has is exactly how a rule ends up with a
      # dead glob — gap 8 of lessons-learned-001, in its new home.
      - name: export twice per blueprint, require identical trees
        run: |
          FAIL=0
          for bp in .claude/blueprints/*/; do
            id=$(basename "$bp")
            [ -f "$bp/$id.yaml" ] || continue
            for n in 1 2; do
              java .claude/hooks/ArchHook.java export "/tmp/exp-$id-$n" --blueprint "$id" \
                > "/tmp/log-$id-$n.txt" 2>&1 || {
                  echo "❌ export failed for blueprint '$id':"; cat "/tmp/log-$id-$n.txt"; FAIL=1; continue; }
            done
            # The provenance stamp carries `exported_at`: it is the one file that is not
            # reproducible, by design, and every comparison excludes it.
            if ! diff -r -x '.arch-provenance.json' "/tmp/exp-$id-1" "/tmp/exp-$id-2" > /tmp/d.txt; then
              echo "❌ blueprint '$id': two exports differ — the transformation is not deterministic."
              head -40 /tmp/d.txt; FAIL=1
            fi
            # A citation to decisions/ or blueprints/ that survived the transform is a
            # dead path inside every project exported afterwards. The mode reports it and
            # still writes; here it is a failure.
            if grep -q "dead citation" "/tmp/log-$id-1.txt"; then
              echo "❌ blueprint '$id': the export reports a surviving dead citation."
              grep -A6 "dead citation" "/tmp/log-$id-1.txt"; FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "✅ Every blueprint exports the same tree twice, with no dead citation."
          exit $FAIL

      # Invariant 9, from the other side: the check above proves the copy lists cover the
      # disk, this one proves nothing travelled that shouldn't.
      - name: the exported tree carries nothing that only exists here
        run: |
          OUT=/tmp/exp-clean-architecture-single-module-1
          FAIL=0
          for forbidden in \
            .claude/decisions \
            .claude/skills/project-bootstrap .claude/skills/init-project \
            .claude/skills/new-project .claude/skills/claude-code-architect-designer \
            .claude/skills/use-case-design/examples \
            .claude/agents/project-initializer.md; do
            if [ -e "$OUT/$forbidden" ]; then
              echo "❌ $forbidden reached the exported tree — it only serves this repository."
              FAIL=1
            fi
          done
          for required in \
            .claude/rules/00-index.md .claude/hooks/ArchHook.java \
            .claude/hooks/ArchHook.jar \
            .claude/schemas/extensions.json .claude/settings.json \
            .claude/.arch-provenance.json; do
            if [ ! -f "$OUT/$required" ]; then
              echo "❌ $required is missing from the exported tree."
              FAIL=1
            fi
          done
          # Every hook in the project launches this jar. A copy that differs from the one
          # `build --verify` just proved is a hook nobody reviewed (0075).
          if ! cmp -s .claude/hooks/ArchHook.jar "$OUT/.claude/hooks/ArchHook.jar"; then
            echo "❌ the exported ArchHook.jar is not the one this repository verified."
            FAIL=1
          fi
          # The catalog does not travel; the ONE blueprint the project was written from
          # does — invariant 9, amended by D55. A project whose stamp names a blueprint it
          # does not carry cannot be updated, which is the failure that amendment closes.
          COUNT=$(find "$OUT/.claude/blueprints" -name '*.yaml' 2>/dev/null | wc -l | tr -d ' ')
          # sed, not python3: java, git and curl are the only dependencies (CLAUDE.md).
          # The stamp is written one key per line by the export mode itself.
          ID=$(sed -n 's/^ *"blueprint": *"\([^"]*\)".*/\1/p' "$OUT/.claude/.arch-provenance.json")
          if [ "$COUNT" != "1" ]; then
            echo "❌ the exported tree carries $COUNT blueprint yaml(s) — it must carry exactly the active one."
            FAIL=1
          elif [ ! -f "$OUT/.claude/blueprints/$ID/$ID.yaml" ]; then
            echo "❌ the stamp names blueprint '$ID' and the tree does not carry it."
            FAIL=1
          fi
          [ "$FAIL" -eq 0 ] && echo "✅ The exported tree is what a project needs, and only that — active blueprint '$ID' included."
          exit $FAIL

      # The exported `extensions.json` is what the project's own hook reads. If it no
      # longer validates, enforcement inside the generated project is off from day one —
      # and `schema` switches itself off with a warning rather than failing, so the exit
      # code alone would not say.
      #
      # Run with the exported tree's OWN jar — the thing its hooks launch — not this
      # repository's source, which the project does not have to agree with.
      - name: the exported tree passes its own schema
        run: |
          OUT=/tmp/exp-clean-architecture-single-module-1
          cd "$OUT"
          CLAUDE_PROJECT_DIR="$OUT" java -jar .claude/hooks/ArchHook.jar schema
          CLAUDE_PROJECT_DIR="$OUT" java -jar .claude/hooks/ArchHook.jar doctor 2>&1 | tee /tmp/doc.txt
          grep -q "Schema ............ ✅" /tmp/doc.txt || {
            echo "❌ The exported tree's schema validation is not on."; exit 1; }
          echo "✅ The exported tree validates itself."

      # 0082 renamed a rule and listed the old name in `export.retired`: without the delete,
      # an updated project keeps both files and loads a norm nobody owns any more. Seed
      # every retired path, export over the tree again, and require each one gone.
      - name: re-export deletes what export.retired names
        run: |
          OUT=/tmp/exp-clean-architecture-single-module-1
          RETIRED=$(sed -n 's/^ *"retired": *\[\(.*\)\],*$/\1/p' .claude/schemas/extensions.json \
                    | tr ',' '\n' | sed 's/^ *"//; s/" *$//; /^$/d')
          [ -n "$RETIRED" ] || { echo "✅ export.retired is empty — nothing to check."; exit 0; }
          for p in $RETIRED; do
            mkdir -p "$(dirname "$OUT/$p")"; printf -- '---\nstatus: active\n---\nseeded\n' > "$OUT/$p"
          done
          java .claude/hooks/ArchHook.java export "$OUT" --blueprint clean-architecture-single-module \
            > /tmp/log-retired.txt 2>&1 || { cat /tmp/log-retired.txt; exit 1; }
          FAIL=0
          for p in $RETIRED; do
            if [ -e "$OUT/$p" ]; then
              echo "❌ $p survived a re-export — export.retired did not delete it."; FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "✅ Every export.retired path is deleted on re-export."
          exit $FAIL

  exemplar-imports:
    name: exemplar imports resolve against the real classpath
    runs-on: ubuntu-latest
    # This job downloads from start.spring.io and resolves the whole test classpath from
    # Maven Central. Both are network, and a hung download is what the default 6h timeout
    # would sit on.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    # Half of lessons-learned-001's gaps (4, 5, 9) were the same mistake: an exemplar
    # names a package that the current Spring Boot or Testcontainers version no longer has.
    # The exemplar "compiles in the head of whoever wrote it" and only blows up in the generated project.
    # This job resolves every `import` against the JARs the Initializr resolves today.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          # No `cache: maven` — this repo has no pom.xml anywhere (it's not a Java
          # app, see CLAUDE.md line 1); setup-java's maven cache scans the checkout
          # for one to build a restore key and hard-fails when it finds none. The
          # reference project this job builds a classpath from lives in /tmp/ref,
          # downloaded below, outside the checkout — caching against the repo was
          # never meaningful here.

      # Versions never written from memory — invariant 8 of CLAUDE.md.
      - name: reference project from the Initializr
        run: |
          # `--fail` is what makes an HTTP error an error: without it a 5xx page is written
          # to starter.tgz, curl exits 0, and the step dies on `gzip: stdin: not in gzip
          # format` — an error that points at tar and says nothing about the outage.
          # `--retry-all-errors` covers the 5xx too, not only the transport failures.
          curl -sS --fail --retry 3 --retry-all-errors --retry-delay 5 --max-time 120 \
            https://start.spring.io/starter.tgz \
            -d type=maven-project -d language=java -d javaVersion=21 \
            -d dependencies=web,data-jpa,flyway,validation,actuator,testcontainers,postgresql,lombok,kafka,batch,quartz,security,oauth2-resource-server,spring-restclient,spring-webclient,oauth2-client,cloud-feign,cache,data-redis,spring-ai-openai,spring-ai-vectordb-pgvector,graphql,data-mongodb,data-elasticsearch \
            -o /tmp/starter.tgz
          mkdir -p /tmp/ref && tar xzf /tmp/starter.tgz -C /tmp/ref
          # micrometer-tracing-bridge-otel is managed by the Boot BOM: no version here,
          # which is what keeps this workflow from pinning a number that ages on its own.
          # `0,/…/` edits only the first `</dependencies>`, the project's own block. `cloud-feign`
          # makes the Initializr add a `<dependencyManagement>` with a second one; a plain `s|…|`
          # also writes the version-less entries there, and a local managed entry with no version
          # overrides the Boot BOM's — Maven then fails on `'dependencies.dependency.version' … is missing`.
          sed -i '0,/<\/dependencies>/s|</dependencies>|<dependency><groupId>io.micrometer</groupId><artifactId>micrometer-tracing-bridge-otel</artifactId></dependency></dependencies>|' /tmp/ref/pom.xml
          # http-client-architect's exemplars (0121): Apache HttpClient 5 is managed by the Boot BOM, no
          # version. Resilience4j and wiremock-spring-boot are not: their versions are read from Maven
          # Central's maven-metadata.xml on every run, never written here (invariant 8).
          R4J=$(curl -sS --fail --retry 3 https://repo1.maven.org/maven2/io/github/resilience4j/resilience4j-spring-boot4/maven-metadata.xml | grep -oE '<release>[^<]+' | sed 's/<release>//')
          WMSB=$(curl -sS --fail --retry 3 https://repo1.maven.org/maven2/org/wiremock/integrations/wiremock-spring-boot/maven-metadata.xml | grep -oE '<release>[^<]+' | sed 's/<release>//')
          test -n "$R4J" -a -n "$WMSB"
          sed -i "0,/<\/dependencies>/s|</dependencies>|<dependency><groupId>com.github.ben-manes.caffeine</groupId><artifactId>caffeine</artifactId></dependency><dependency><groupId>org.springframework.data</groupId><artifactId>spring-data-envers</artifactId></dependency><dependency><groupId>org.apache.httpcomponents.client5</groupId><artifactId>httpclient5</artifactId></dependency><dependency><groupId>io.github.resilience4j</groupId><artifactId>resilience4j-spring-boot4</artifactId><version>$R4J</version></dependency><dependency><groupId>org.wiremock.integrations</groupId><artifactId>wiremock-spring-boot</artifactId><version>$WMSB</version><scope>test</scope></dependency></dependencies>|" /tmp/ref/pom.xml
          # messaging-architect's AsyncAPI exemplars (0162) import Springwolf, which the Boot BOM does not
          # manage: the latest 2.x release of the Spring Boot 4 line, read from maven-metadata.xml on every
          # run, never written here (invariant 8).
          SW=$(curl -sS --fail --retry 3 https://repo1.maven.org/maven2/io/github/springwolf/springwolf-kafka/maven-metadata.xml | grep -oE '<version>2\.[0-9.]+</version>' | tail -1 | sed -E 's/<[^>]+>//g')
          test -n "$SW"
          sed -i "0,/<\/dependencies>/s|</dependencies>|<dependency><groupId>io.github.springwolf</groupId><artifactId>springwolf-kafka</artifactId><version>$SW</version></dependency></dependencies>|" /tmp/ref/pom.xml
          grep -m1 -A1 '<artifactId>spring-boot-starter-parent' /tmp/ref/pom.xml

      - name: build the classpath
        run: |
          cd /tmp/ref
          ./mvnw -q -B dependency:build-classpath \
            -Dmdep.outputFile=/tmp/cp.txt -Dmdep.includeScope=test
          wc -c /tmp/cp.txt

      - name: every exemplar import exists in a JAR
        run: |
          CP=$(cat /tmp/cp.txt)
          FAIL=0
          # Only the prefixes the reference project brings. An import from springdoc or
          # archunit isn't checkable here and is skipped on purpose — better not to
          # check than to treat as verified what wasn't verified. `batch` and `quartz` are in
          # the reference project because jobs-architect's exemplars import both (0087);
          # ShedLock, db-scheduler and JobRunr are not Initializr dependencies and stay
          # unchecked here. `security` and `oauth2-resource-server` are there because
          # security-architect's exemplars import both, and test-architect's secured
          # controller test imports the security test support the `security` entry adds (0112).
          # `spring-restclient`, `spring-webclient`, `oauth2-client` and `cloud-feign`, plus the three
          # artifacts added to the pom above, are there because http-client-architect's exemplars and
          # test-architect's HttpClientAdapterIT import them (0121). The OpenAPI Generator plugin is a
          # build plugin, not an import, and stays unchecked here.
          # `cache` and `data-redis`, plus Caffeine added to the pom above (managed by the Boot parent),
          # are there because cache-architect's exemplars and test-architect's CachedAdapterIT
          # import them (0144).
          # `spring-ai-openai` and `spring-ai-vectordb-pgvector` are there because ai-architect's
          # exemplars and test-architect's three AI tests import Spring AI, the OpenAI SDK and Jackson 3
          # (0145) — the Initializr offers them for Boot 4 only, which is the line those exemplars are.
          # `graphql` is there because graphql-api-architect's exemplars and test-architect's three
          # GraphQL tests import Spring for GraphQL, graphql-java and the GraphQL test support (0146);
          # the `graphql` and `org.dataloader` prefixes below are graphql-java's and java-dataloader's roots.
          # `data-mongodb` and `data-elasticsearch` are there because persistence-architect's document
          # exemplars, search-architect's exemplars and test-architect's MongoPersistenceIT and
          # SearchIndexIT import Spring Data MongoDB and Elasticsearch, the MongoDB driver, BSON and the
          # Elasticsearch client (0147); `com.mongodb`, `org.bson` and `co.elastic` are their roots.
          # Spring Data OpenSearch is not an Initializr dependency: no exemplar imports it.
          # `spring-data-envers`, added to the pom above with no version (the Boot parent manages it, and
          # it brings `hibernate-envers`), is there because persistence-architect's auditing exemplars
          # and test-architect's AuditHistoryIT import Envers and Spring Data's history (0149); both sit
          # under the `org.hibernate` and `org.springframework` prefixes already checked.
          PREFIXES='^(org\.springframework|org\.testcontainers|jakarta|io\.micrometer|org\.junit|org\.assertj|org\.slf4j|org\.hibernate|lombok|org\.quartz|org\.apache\.hc|io\.github\.resilience4j|io\.github\.springwolf|reactor|feign|org\.wiremock|com\.github\.tomakehurst|com\.github\.benmanes|com\.openai|tools\.jackson|graphql|org\.dataloader|com\.mongodb|org\.bson|co\.elastic)\.'
          IMPORTS=$(grep -rhoE '^ *import (static )?[a-z][a-zA-Z0-9_.]+;' \
                      .claude/skills/*/templates/*.java.example \
                    | sed -E 's/^ *import (static )?//; s/;$//' | sort -u)
          for fqcn in $IMPORTS; do
            echo "$fqcn" | grep -qE "$PREFIXES" || continue
            # Static import: the class is the second-to-last segment.
            CLASS=$(echo "$fqcn" | grep -qE '\.[a-z][a-zA-Z0-9_]*$' \
                     && echo "$fqcn" | sed -E 's/\.[^.]+$//' || echo "$fqcn")
            if ! javap -cp "$CP" "$CLASS" > /dev/null 2>&1; then
              echo "❌ $CLASS does not exist in any JAR of the reference project."
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "✅ Every checkable exemplar import resolves."
          exit $FAIL

      # Gap 5: the constant doesn't disappear, it's deprecated — the compiler warns and the warning
      # gets lost. javap doesn't distinguish, so it's verified by name.
      - name: exemplars don't use known deprecated symbols
        run: |
          FAIL=0
          # Each entry: symbol that must not appear, and why. Add a line
          # whenever a new version renames something — it's the record that keeps the
          # exemplar from regressing to the old name on the next rewrite. The yml exemplars are
          # scanned too: a serializer class is named in `application-kafka.yml.example`, not imported.
          DENY="HttpStatus.UNPROCESSABLE_ENTITY=deprecated in Spring Framework 7; RFC 9110 renamed it to UNPROCESSABLE_CONTENT
          org.springframework.boot.test.autoconfigure.orm.jpa=Boot 3 package; in Boot 4 it's org.springframework.boot.data.jpa.test.autoconfigure
          org.springframework.boot.test.autoconfigure.web.servlet=Boot 3 package; in Boot 4 it's org.springframework.boot.webmvc.test.autoconfigure
          org.testcontainers.containers.PostgreSQLContainer=Testcontainers 1.x package; in 2.x it's org.testcontainers.postgresql
          org.testcontainers.containers.MongoDBContainer=Testcontainers 1.x package; in 2.x it's org.testcontainers.mongodb (decision 0147)
          org.springframework.kafka.support.serializer.JsonSerializer=deprecated for removal since spring-kafka 4.0, and a JSON value serializer double-encodes the outbox relay's text; the wire contract is StringSerializer (decision 0106)
          org.springframework.kafka.support.serializer.JsonDeserializer=deprecated for removal since spring-kafka 4.0; the wire contract is StringDeserializer plus a StringJacksonJsonMessageConverter bean (decision 0106)
          requiresChannel(=deprecated in the Spring Security generation Boot 4 manages; redirectToHttps() replaces it (decision 0122)
          GenericJackson2JsonRedisSerializer=deprecated for removal in Spring Data Redis 4; one typed JacksonJsonRedisSerializer per cache (decision 0144)
          Jackson2JsonRedisSerializer=deprecated for removal in Spring Data Redis 4; JacksonJsonRedisSerializer replaces it (decision 0144)"
          # `<<<`, not `echo … | while`: a pipeline runs the loop in a subshell, where
          # `FAIL=1` is lost and the only way to fail the step is `exit 1` inside it — which
          # aborts the sweep at the first hit. Six symbols, one reported. Here the loop
          # runs in this shell, so every entry is checked and every hit is printed.
          while IFS= read -r linha; do
            SYMBOL=$(echo "$linha" | sed -e 's/=.*//' -e 's/^ *//')
            REASON=$(echo "$linha" | sed 's/^[^=]*=//')
            [ -n "$SYMBOL" ] || continue
            if grep -rn --fixed-strings "$SYMBOL" .claude/skills/*/templates/*.java.example .claude/skills/*/templates/*.yml.example; then
              echo "❌ '$SYMBOL' — $REASON"
              FAIL=1
            fi
          done <<< "$DENY"
          [ "$FAIL" -eq 0 ] && echo "✅ No denylist symbol in the exemplars."
          exit $FAIL

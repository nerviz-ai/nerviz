<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1008" height="856" viewBox="0 0 1008 856" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Nerviz — the layers of .claude/</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
<style>
@keyframes show{from{opacity:0}to{opacity:1}}
.r{animation:show 0.5s ease both}
</style>
<rect width="1008" height="856" fill="#FBFAF7"/>
<text x="32" y="54" font-size="22" font-weight="700" fill="#1F2933">Nerviz — the layers of .claude/</text>
<text x="32" y="78" font-size="12" fill="#52606D">Dependencies point down; the leaf holds norms and data. Counts are the entries on disk when this was rendered.</text>
<g id="row-interface" class="r" style="animation-delay:0.00s">
<rect x="32" y="96" width="944" height="88" rx="8" fill="#DCEFF7" fill-opacity="0.45" stroke="#2B7A9B" stroke-width="1.5"/>
<text x="48" y="125" font-size="13" font-weight="700" fill="#1F2933">Interface</text>
</g>
<g id="row-enforcement" class="r" style="animation-delay:1.40s">
<rect x="32" y="224" width="944" height="88" rx="8" fill="#FBE3D6" fill-opacity="0.45" stroke="#C4572A" stroke-width="1.5"/>
<text x="48" y="253" font-size="13" font-weight="700" fill="#1F2933">Infrastructure — enforcement</text>
</g>
<g id="row-procedure" class="r" style="animation-delay:2.80s">
